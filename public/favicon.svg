<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <circle cx="32" cy="32" r="24" fill="url(#silverGrad)"/>
  <!-- Red ambient rim glow -->
  <circle cx="32" cy="32" r="24" stroke="url(#redGlow)" stroke-width="2.5" opacity="0.9"/>
  <!-- Latitude & longitude arcs in silver chrome -->
  <ellipse cx="32" cy="32" rx="20" ry="24" stroke="#E8E8E8" stroke-width="1.2" opacity="0.6"/>
  <ellipse cx="32" cy="32" rx="10" ry="24" stroke="#FFFFFF" stroke-width="1.2" opacity="0.75"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#FFFFFF" stroke-width="1.2" opacity="0.75"/>
  <ellipse cx="32" cy="20" rx="20.7" ry="8" stroke="#E8E8E8" stroke-width="1" opacity="0.5"/>
  <ellipse cx="32" cy="44" rx="20.7" ry="8" stroke="#E8E8E8" stroke-width="1" opacity="0.5"/>
  <!-- Outer red flare -->
  <circle cx="22" cy="18" r="4" fill="#B00000" filter="blur(2px)" opacity="0.8"/>
  <circle cx="22" cy="18" r="1.5" fill="#FFFFFF"/>
  <defs>
    <radialGradient id="silverGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E0E0E0"/>
      <stop offset="70%" stop-color="#8E9094"/>
      <stop offset="100%" stop-color="#1E2024"/>
    </radialGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333"/>
      <stop offset="40%" stop-color="#B00000"/>
      <stop offset="100%" stop-color="#300000" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
